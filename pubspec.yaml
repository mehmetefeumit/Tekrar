name: tekrar
description: "French language-learning app built around daily spaced repetition."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  injectable_generator: ^2.7.0

  # Testing
  bloc_test: ^10.0.0
  mockito: ^5.4.5
  build_verify: ^3.1.0

  # Integration testing
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
